function statsByLoc(loc){
  let partners = new Set(), amenities = 0;
  dataset.forEach(cat => cat.partners.forEach(p => {
    const matching = p.amenities.filter(a => a.location === loc);
    if (matching.length){ partners.add(p.name); amenities += matching.length; }
  }));
  return { partners: partners.size, amenities: amenities };
}

  "UK — "+ukStats.partners+" partners, "+ukStats.amenities+" amenities &nbsp;&nbsp;&middot;&nbsp;&nbsp; Spain — "+esStats.partners+" partners, "+esStats.amenities+" amenities";

function textOn(hex){
  const c = d3.rgb(hex);
  const lum = (0.299*c.r + 0.587*c.g + 0.114*c.b) / 255;
  return lum > 0.62 ? black : "#ffffff";
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function wrapLines(name, maxCharsPerLine, maxLines){
  const words = name.split(" ");
  const lines = [];
  let cur = "";
  for (const w of words){
    const test = cur ? cur + " " + w : w;
    if (test.length <= maxCharsPerLine || !cur){
      cur = test;
    } else {
      lines.push(cur);
      cur = w;
    }
  }
  if (cur) lines.push(cur);
  if (lines.length <= maxLines) return lines;
  const shown = lines.slice(0, maxLines);
  let last = shown[maxLines-1];
  if (last.length > maxCharsPerLine - 1) last = last.slice(0, maxCharsPerLine-1);
  shown[maxLines-1] = last.trim() + "…";
  return shown;
}

function buildTreeForLocation(loc){
  const cats = dataset.map(cat => ({
    name: cat.name,
    partnerCount: new Set(cat.partners.filter(p => p.amenities.some(a => a.location === loc)).map(p => p.name)).size,
    children: cat.partners.flatMap(p => p.amenities
      .filter(a => a.location === loc)
      .map(a => ({
        name: a.name,
        partner: p.name,
        commission: a.commission || p.commission,
        benefit: a.benefit || p.benefit,
        setup: a.setup,
        value: 1
      })))
  })).filter(cat => cat.children.length > 0);
  return { name: "root", children: cats };
}

function initSunburst(loc, svgSel, tooltipSel, rootLabel){
  const root = d3.hierarchy(buildTreeForLocation(loc)).sum(d => d.value || 0);
  const radius = 300;
  d3.partition().size([2*Math.PI, radius])(root);

  const holeR = 45, categoryOuterR = 190, partnerOuterR = radius;
  root.each(d => {
    if (d.depth === 0){ d.y0 = 0; d.y1 = holeR; }
    else if (d.depth === 1){ d.y0 = holeR; d.y1 = categoryOuterR; }
    else { d.y0 = categoryOuterR; d.y1 = partnerOuterR; }
  });
  root.each(d => d.current = { x0: d.x0, x1: d.x1, y0: d.y0, y1: d.y1 });

  const nodes = root.descendants().filter(d => d.depth > 0);
  let focus = root;

  function fillOf(d){
    if (d.depth === 1) return categoryColor[d.data.name] || "#969CA3";
    return setupColor[d.data.setup] || setupColor["Not specified"];
  }

  const arcGen = d3.arc()
    .startAngle(d => d.x0).endAngle(d => d.x1)
    .padAngle(0.006)
    .innerRadius(d => d.y0)
    .outerRadius(d => Math.max(d.y0, d.y1 - 1.5));

  const svg = d3.select(svgSel);
  const g = svg.append("g").attr("transform", "translate(330,330)");
  const tooltip = d3.select(tooltipSel);
  const container = tooltip.node().parentNode;

  function tipHtml(d){
    if (d.depth === 1){
      return "<b>"+esc(d.data.name)+"</b><br>"+d.data.partnerCount+" partner"+(d.data.partnerCount===1?"":"s")+" &middot; "+d.value+" amenit"+(d.value===1?"y":"ies");
    }
    return "<b>"+esc(d.data.name)+"</b><br>Partner: "+esc(d.data.partner)+
      "<br>Commission: "+esc(d.data.commission||"Not specified")+
      "<br>User benefit: "+esc(d.data.benefit||"Not specified")+
      "<br>Way of working: "+esc(d.data.setup||"Not specified");
  }

  function arcVisible(d){ return d.y1 <= partnerOuterR + 0.5 && d.y0 >= -0.5 && d.x1 > d.x0; }
  function labelVisible(d){ return arcVisible(d) && d.y0 >= holeR - 0.5 && (d.x1 - d.x0) > 0.06; }
  function labelTransform(d){
    const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
    const y = (d.y0 + d.y1) / 2;
    return "rotate("+(x-90)+") translate("+y+",0) rotate("+(x < 180 ? 0 : 180)+")";
  }
  function fontSizeOf(d){ return d.depth === 1 ? 13 : 10.5; }
  function maxCharsOf(d){ return d.depth === 1 ? 20 : 16; }
  function renderLines(textEl, geom, d){
    const sel = d3.select(textEl);
    sel.selectAll("tspan").remove();
    const angW = Math.max(0, geom.x1 - geom.x0);
    const midR = (geom.y0 + geom.y1) / 2;
    const arcLen = angW * midR;
    const fontSize = fontSizeOf(d);
    const lineH = fontSize * 1.15;
    const maxLines = Math.max(1, Math.min(3, Math.floor(arcLen / lineH)));
    const lines = wrapLines(d.data.name, maxCharsOf(d), maxLines);
    const lhEm = 1.1;
    lines.forEach((line, i) => {
      sel.append("tspan")
        .attr("x", 0)
        .attr("dy", i === 0 ? (0.35 - (lines.length - 1) * lhEm / 2) + "em" : lhEm + "em")
        .text(line);
    });
  }

  const path = g.selectAll("path").data(nodes).join("path")
    .attr("fill", fillOf)
    .attr("fill-opacity", d => arcVisible(d.current) ? 1 : 0)
    .attr("pointer-events", d => arcVisible(d.current) ? "auto" : "none")
    .attr("stroke", "#ffffff")
    .attr("stroke-width", 1)
    .style("cursor", d => d.children ? "pointer" : "default")
    .attr("d", d => arcGen(d.current));

  path.on("click", clicked)
    .on("mousemove", function(event, d){
      if (!arcVisible(d.current)) return;
      const related = new Set(d.ancestors().concat(d.descendants()));
      path.attr("opacity", n => related.has(n) ? 1 : 0.28);
      const rect = container.getBoundingClientRect();
      tooltip.style("display","block")
        .style("left", Math.min(event.clientX - rect.left + 14, rect.width - 235) + "px")
        .style("top", Math.max(event.clientY - rect.top - 10, 0) + "px")
        .html(tipHtml(d));
    })
    .on("mouseleave", function(){
      path.attr("opacity", 1);
      tooltip.style("display","none");
    });

  const label = g.append("g").attr("pointer-events","none").selectAll("text")
    .data(nodes).join("text")
    .attr("text-anchor","middle")
    .style("font-weight","500").style("font-family","'Rubik',sans-serif")
    .style("fill-opacity", d => +labelVisible(d.current))
    .style("font-size", d => fontSizeOf(d)+"px")
    .attr("transform", d => labelTransform(d.current))
    .attr("fill", d => textOn(fillOf(d)));

  label.each(function(d){ renderLines(this, d.current, d); });

  const centerCircle = g.append("circle")
    .attr("r", holeR).attr("fill", "#F6F7F8")
    .attr("stroke", "#D0D2D4").attr("stroke-width", 0.5)
    .style("cursor", "pointer")
    .on("click", (event) => clicked(event, focus.parent || root));

  const centerLabel = g.append("text")
    .attr("text-anchor","middle").attr("dy","0.35em")
    .style("font-size","12px").style("font-weight","500").style("font-family","'Rubik',sans-serif")
    .attr("pointer-events","none").attr("fill", "#191C25")
    .text(rootLabel);

  function clicked(event, p){
    if (!p || p === focus) return;
    if (p !== root && !p.children) return;
    focus = p;
    centerLabel.text(p === root ? rootLabel : p.data.name);

    root.each(d => {
      const tx0 = Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI;
      const tx1 = Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI;
      let ty0, ty1;
      if (d === p){ ty0 = 0; ty1 = holeR; }
      else if (p.children && p.children.indexOf(d) !== -1){ ty0 = holeR; ty1 = partnerOuterR; }
      else { ty0 = d.y0; ty1 = d.y1; }
      d.target = { x0: tx0, x1: tx1, y0: ty0, y1: ty1 };
    });

    label.each(function(d){ renderLines(this, d.target, d); });

    const t = g.transition().duration(650);
    path.transition(t)
      .tween("data", d => { const i = d3.interpolate(d.current, d.target); return time => d.current = i(time); })
      .attr("fill-opacity", d => arcVisible(d.target) ? 1 : 0)
      .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none")
      .attrTween("d", d => () => arcGen(d.current));
    label.transition(t)
      .style("fill-opacity", d => +labelVisible(d.target))
      .attrTween("transform", d => () => labelTransform(d.current));
  }
}

initSunburst("UK", "#sunburst2-UK", "#tooltip2-UK", "UK");
initSunburst("ES", "#sunburst2-ES", "#tooltip2-ES", "Spain");
